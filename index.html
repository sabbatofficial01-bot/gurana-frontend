
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURANA | Food Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GURANA</h1>
        <p>Your Food Marketplace in Rwanda</p>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Fresh Food, Delivered to Your Door</h2>
        <p>Shop your favourite food products with GURANA.</p>
        <a href="#products" class="btn">Shop Now</a>
    </section>

    <main>
        <section id="products">
            <h2>Our Products</h2>
            <div id="product-list" class="products">
                <p>Loading products...</p>
            </div>
        </section>

        <section id="cart">
            <h2>Your Shopping Cart</h2>
            <div id="cart-items"></div>
            <h3>Total: <span id="cart-total">0</span> RWF</h3>
        </section>

        <section id="checkout">
            <h2>Checkout</h2>

            <form id="checkout-form">
                <input type="text" id="customerName"
                    placeholder="Your full name" required>

                <input type="tel" id="phone"
                    placeholder="Phone number" required>

                <input type="text" id="address"
                    placeholder="Delivery address" required>

                <select id="paymentMethod" required>
                    <option value="">Select payment method</option>
                    <option value="MTN Mobile Money">MTN Mobile Money</option>
                    <option value="Airtel Money">Airtel Money</option>
                    <option value="Cash on Delivery">Cash on Delivery</option>
                </select>

                <button type="submit" class="btn">
                    Place Order
                </button>
            </form>

            <p id="message"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 GURANA. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
